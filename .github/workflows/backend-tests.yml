name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: preparation_test
          MYSQL_USER: preparation_ci
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run common module unit tests
        run: python -m unittest discover -s common_tests -v
      - name: Run existing tests against MySQL
        # job 컨텍스트는 job 단위 env에서 쓸 수 없어 step env에 둔다.
        env:
          # This account exists only in the disposable CI service container.
          TEST_DATABASE_URL: mysql+pymysql://preparation_ci:ci-test-only@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/preparation_test
        run: python -m pytest -q
