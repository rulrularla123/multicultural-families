name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U legal"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check app ingest tests scripts
      - name: Migrate, load laws, run tests (fake LLM)
        # job 컨텍스트는 job 단위 env에서 쓸 수 없어 step env에 둔다. 계정은 CI 컨테이너 전용이다.
        env:
          DATABASE_URL: postgresql+asyncpg://legal:legal@127.0.0.1:${{ job.services.db.ports['5432'] }}/legal
          LLM_FAKE: 'true'
          TEST_DB: '1'
        run: |
          alembic upgrade head
          python -m ingest load
          python -m pytest -q
